name: release

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '*.md'

jobs:
  build:
    strategy:
      matrix: # not using ubuntu-latest to improve compatibility
        os: [{name: ubuntu, version: ubuntu-22.04}, {name: macos, version: macos-latest}, {name: windows, version: windows-latest}]
    name: ${{matrix.os.name}}
    runs-on: ${{matrix.os.version}}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: configure
      run: cmake . -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: cmake --build . --config Release -j 2
    - uses: actions/upload-artifact@v7
      if: matrix.os.name != 'windows'
      with:
        name: luwow-project-${{matrix.os.name}}
        path: build/bin
        overwrite: true
    - uses: actions/upload-artifact@v7
      if: matrix.os.name == 'windows'
      with:
        name: luwow-project-${{matrix.os.name}}
        path: build\bin\Release
        overwrite: true
