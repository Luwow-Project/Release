name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, such as v0.1.0"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like v0.2.0, got $VERSION"
            exit 1
          fi

      - name: Find or create the release
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$VERSION is already released, its archives are replaced"
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$VERSION" --generate-notes --draft
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix: # not using ubuntu-latest to improve compatibility
        os: [{name: linux-x64, version: ubuntu-22.04}, {name: macos-arm64, version: macos-latest}, {name: windows-x64, version: windows-latest}]
    name: ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.version }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -D "LUWOW_RELEASE_VERSION=$VERSION"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Install
        run: |
          cmake --install build --config Release --prefix dist --component executables
          cmake --install build --config Release --prefix sdk --component sdk

      # Nothing is uploaded that fails the tests, which also build a library from the SDK being released
      - name: Test
        run: |
          sdk="$(cd sdk && (pwd -W 2>/dev/null || pwd))"
          cmake -S tests/sdk -B build-sdk -D CMAKE_BUILD_TYPE=Release -D "LuwowSDK_DIR=$sdk/cmake"
          cmake --build build-sdk --config Release
          library="$(find build-sdk/libraries -name 'sdktest.*' | head -n 1)"
          python tests/run_tests.py --bin dist/bin --libraries "$(dirname "$library")"

      # luwow-<version>-<os>.zip has the executables at its root, luwow-sdk-<version>-<os>.zip the SDK's
      # cmake, include and lib folders
      - name: Pack
        run: |
          mkdir packages
          out="$PWD/packages"
          pack() {
            if [ "$RUNNER_OS" = "Windows" ]; then
              (cd "$1" && 7z a -tzip "$out/$2.zip" . > /dev/null)
            else
              (cd "$1" && zip -qry "$out/$2.zip" .)
            fi
          }
          pack dist/bin "luwow-${VERSION}-${{ matrix.os.name }}"
          pack sdk "luwow-sdk-${VERSION}-${{ matrix.os.name }}"
          ls -l packages

      - name: Upload
        run: gh release upload "$VERSION" packages/*.zip --repo "$GITHUB_REPOSITORY" --clobber
