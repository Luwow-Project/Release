name: Tests

on:
  push:
      branches:
        - 'main'
      paths-ignore:
        - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  require:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -D CMAKE_BUILD_TYPE=Release

      - name: Build
        id: build
        run: cmake --build build --config Release --parallel 4

      # The executables and the SDK
      - name: Install
        run: |
          cmake --install build --config Release --prefix dist --component executables
          cmake --install build --config Release --prefix sdk --component sdk

      # A library built from the installed SDK
      - name: Build the SDK test library
        id: sdk
        run: |
          sdk="$(cd sdk && (pwd -W 2>/dev/null || pwd))"
          cmake -S tests/sdk -B build-sdk -D CMAKE_BUILD_TYPE=Release -D "LuwowSDK_DIR=$sdk/cmake"
          cmake --build build-sdk --config Release
          library="$(find build-sdk/libraries -name 'sdktest.*' | head -n 1)"
          if [ -z "$library" ]; then
            echo "The SDK test library wasn't built"
            exit 1
          fi
          echo "SDKTEST_LIBRARIES=$(dirname "$library")" >> "$GITHUB_ENV"

      # The runscript tests
      - name: Script tests (runscript)
        id: script
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: python tests/run_tests.py --bin dist/bin --libraries "$SDKTEST_LIBRARIES" --suite script

      # The package tests
      - name: Package tests (compile + runpackage)
        id: package
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: python tests/run_tests.py --bin dist/bin --libraries "$SDKTEST_LIBRARIES" --suite package

      # Total: Passed and failed
      - name: Totals
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          echo "Script runs:  ${{ steps.script.outputs.runs_passed }} passed, ${{ steps.script.outputs.runs_failed }} failed"
          echo "Package runs: ${{ steps.package.outputs.runs_passed }} passed, ${{ steps.package.outputs.runs_failed }} failed"
